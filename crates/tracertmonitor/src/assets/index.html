<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TracertMonitor</title>
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
  <main class="cockpit">
    <header class="session-bar">
      <section class="target-block">
        <span class="eyebrow">TracertMonitor Cockpit</span>
        <h1 id="target">Loading...</h1>
        <p class="session-copy">演示模式：浏览器端会持续推进样本，模拟真实链路监测刷新。</p>
      </section>
      <section class="monitor-controls" aria-label="monitor controls">
        <div class="control-card target-control">
          <label for="target-input">测试目标站点</label>
          <div class="control-row">
            <input id="target-input" type="text" autocomplete="off" placeholder="输入域名或 IP">
            <button id="target-apply" type="button">应用</button>
          </div>
          <div id="target-presets" class="preset-sites" aria-label="快捷站点"></div>
        </div>
        <div class="control-card frequency-control">
          <label for="packet-frequency">发包频率</label>
          <div class="control-row">
            <select id="packet-frequency" aria-label="发包频率">
              <option value="1000">1 秒 / 包</option>
              <option value="2500" selected>2.5 秒 / 包</option>
              <option value="5000">5 秒 / 包</option>
              <option value="10000">10 秒 / 包</option>
              <option value="custom">自定义</option>
            </select>
            <input id="packet-frequency-custom" type="number" min="0.2" max="60" step="0.1" value="2.5" hidden aria-label="自定义发包频率秒数">
          </div>
          <span id="packet-frequency-label" class="control-hint">当前 2.5 秒 / 包</span>
        </div>
      </section>
      <section class="status-strip" aria-label="session status">
        <div><span>状态</span><strong id="live-state">实时监测中</strong></div>
        <div><span>样本</span><strong id="sample-count">--</strong></div>
        <div><span>刷新</span><strong id="refresh-at">--</strong></div>
      </section>
      <nav class="actions" aria-label="exports">
        <a href="/export/session.json">JSON</a>
        <a href="/export/path-summary.csv">Path CSV</a>
        <a href="/export/hop-summary.csv">Hop CSV</a>
        <a href="/export/observations.csv">Observation CSV</a>
        <a href="/export/events.csv">Events CSV</a>
      </nav>
    </header>

    <aside class="summary-panel panel">
      <div class="panel-header compact">
        <h2>疑似问题路径</h2>
      </div>
      <div id="suspicions" class="stack"></div>
      <div class="event-block">
        <h2>事件</h2>
        <div id="events" class="stack"></div>
      </div>
    </aside>

    <section class="topology-panel panel">
      <div class="panel-header topology-header">
        <h2>全路径拓扑</h2>
        <div class="topology-toolbar">
          <div id="topology-mode" class="topology-mode-toggle" aria-label="拓扑展示模式">
            <button type="button" data-topology-mode="paths" aria-pressed="true">按路径</button>
            <button type="button" data-topology-mode="merged" aria-pressed="false">汇聚拓扑</button>
          </div>
          <div class="zoom-controls">
            <button id="zoom-in" type="button" title="放大">+</button>
            <button id="zoom-out" type="button" title="缩小">-</button>
            <button id="zoom-reset" type="button" title="重置视角">Reset</button>
          </div>
        </div>
      </div>
      <div id="topology" class="topology-canvas"></div>
    </section>

    <aside class="detail-panel panel">
      <div class="panel-header compact">
        <h2>路径详情</h2>
      </div>
      <div id="details"></div>
    </aside>

    <section class="timeline-panel panel">
      <div class="panel-header timeline-header">
        <div>
          <h2>路径实时监控</h2>
          <p>每条路径独立绘制 RTT 折线、丢包点和窗口命中概率。</p>
        </div>
        <div class="window-controls">
          <select id="window-select" aria-label="time window">
            <option value="full">全会话</option>
            <option value="5m">最近 5 分钟</option>
            <option value="1m">最近 1 分钟</option>
            <option value="custom">自定义</option>
          </select>
          <input id="window-start" type="datetime-local" hidden aria-label="start time">
          <input id="window-end" type="datetime-local" hidden aria-label="end time">
        </div>
      </div>
      <div id="lanes" class="lanes"></div>
      <div id="hover-readout" class="readout">移动到路径折线图上查看当前时间点的精确数值</div>
    </section>
  </main>
  <script src="/assets/app.js"></script>
</body>
</html>
